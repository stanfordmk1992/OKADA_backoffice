<!doctype html>
<html lang="en" data-root="../../">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Fund Transactions Report</title>
<link rel="stylesheet" href="../../assets/app.css">
</head>
<body>
<div id="page">
  <div class="card">
    <div class="card-head"><div><h1>Fund Transactions Report</h1><div class="muted small">優惠錢包交易(類型 Promo Wallet - …)的 Before / After Balance 為該玩家優惠錢包待領取金額;Bonus Payout 與 Deposit / Bet 為 OKash Balance 餘額</div></div><button class="btn sec" id="btn-csv">Download CSV</button></div>
    <div class="filters">
      <div class="field"><label>Fund Transactions Report</label><div style="display:flex;gap:6px"><input type="date" id="f-from" aria-label="Date From"><input type="date" id="f-to" aria-label="Date To"></div></div>
      <div class="field"><label for="f-player">Player ID</label><input id="f-player"></div>
      <div class="field"><label for="f-type">Transaction Type</label><select id="f-type"></select></div>
      <div class="field"><label for="f-status">Status</label><select id="f-status"><option value="">All</option><option>Success</option><option>Failed</option></select></div>
      <div class="field"><label for="f-ref">Ref ID</label><input id="f-ref"></div>
      <button class="btn" id="btn-search">Search</button><button class="btn sec" id="btn-clear">Clear</button>
    </div>
    <div class="kpis" id="sums"></div>
    <div id="result"></div>
  </div>
</div>
<script src="../../assets/store.js"></script>
<script src="../../assets/ui.js"></script>
<script src="../../assets/sim.js"></script>
<script src="../../assets/bo.js"></script>
<script>
(function () {
  var S = Store, esc = S.esc, money = S.money, q = {};
  var NEWTYPES = [S.TX.PW_ISSUE, S.TX.PW_CLAIM, S.TX.PW_EXPIRY, S.TX.PW_CANCEL];
  var TYPES = ['Bet Placement', 'Bonus Expiry', 'Bonus Payout', 'Bonus Referral', 'Deposit', 'Withdrawal', 'Wallet Adjustment'].concat(NEWTYPES);
  document.getElementById('f-type').innerHTML = '<option value="">All</option>' + TYPES.map(function (t) { return '<option value="' + esc(t) + '">' + esc(t) + (NEWTYPES.indexOf(t) >= 0 ? '(NEW)' : '') + '</option>'; }).join('');
  var initRef = S.qs('ref'); if (initRef) { q.ref = initRef; document.getElementById('f-ref').value = initRef; }
  function rows(s) {
    var a = q.from ? S.dayStart(q.from) : -Infinity, b = q.to ? S.dayEnd(q.to) : Infinity;
    return s.ftx.slice().sort(function (x, y) { return y.at - x.at || y.id - x.id; }).filter(function (x) {
      return x.at >= a && x.at <= b && (!q.player || S.player(s, x.playerId).name.indexOf(q.player) >= 0) && (!q.type || x.type === q.type) && (!q.status || x.status === q.status) && (!q.ref || String(x.ref).indexOf(q.ref) >= 0);
    });
  }
  function render(s) {
    var rs = rows(s);
    var by = {}; rs.forEach(function (x) { by[x.type] = by[x.type] || { n: 0, amt: 0 }; by[x.type].n++; by[x.type].amt += x.amount; });
    document.getElementById('sums').innerHTML = Object.keys(by).sort().map(function (k) { return '<div class="kpi" data-sum-type="' + esc(k) + '"><span>' + esc(k) + '</span><b>' + money(by[k].amt) + '</b><span>' + by[k].n + ' 筆</span></div>'; }).join('');
    document.getElementById('result').innerHTML = UI.table([
      { t: 'Player ID', k: function (x) { return esc(S.player(s, x.playerId).name); } },
      { t: 'Transaction Type', k: function (x) { return esc(x.type) + (NEWTYPES.indexOf(x.type) >= 0 ? ' <span class="tag-new">NEW</span>' : ''); } },
      { t: 'Wallet From', k: function (x) { return esc(x.from); } },
      { t: 'Wallet To', k: function (x) { return esc(x.to); } },
      { t: 'Ref ID', k: function (x) { return '<span class="mono">' + esc(x.ref) + '</span>'; }, cls: 'nowrap' },
      { t: 'Transaction Date', k: function (x) { return S.fmt(x.at); }, cls: 'nowrap' },
      { t: 'Status', k: function (x) { return x.status; } },
      { t: 'Before Balance', k: function (x) { return money(x.before); }, cls: 'right' },
      { t: 'Transaction Amount', k: function (x) { return money(x.amount); }, cls: 'right' },
      { t: 'After Balance', k: function (x) { return money(x.after); }, cls: 'right' },
      { t: 'Remarks', k: function (x) { return '<span class="small">' + esc(x.remarks) + '</span>'; } }
    ], rs, { id: 'tbl-ftx' });
  }
  document.getElementById('btn-search').onclick = function () { q = { from: UI.val('f-from'), to: UI.val('f-to'), player: UI.val('f-player'), type: UI.val('f-type'), status: UI.val('f-status'), ref: UI.val('f-ref') }; render(S.load()); };
  document.getElementById('btn-clear').onclick = function () { ['f-from', 'f-to', 'f-player', 'f-type', 'f-status', 'f-ref'].forEach(function (i) { document.getElementById(i).value = ''; }); q = {}; render(S.load()); };
  document.getElementById('btn-csv').onclick = function () {
    var s = S.load();
    UI.csv('fund-transactions.csv', ['Player ID', 'Transaction Type', 'Wallet From', 'Wallet To', 'Ref ID', 'Transaction Date', 'Status', 'Before Balance', 'Transaction Amount', 'After Balance', 'Remarks'],
      rows(s).map(function (x) { return [S.player(s, x.playerId).name, x.type, x.from, x.to, x.ref, S.fmt(x.at), x.status, x.before.toFixed(2), x.amount.toFixed(2), x.after.toFixed(2), x.remarks]; }));
  };
  BO.init({ perm: 'view:fund-transaction-report', active: 'fund-transaction', crumb: 'Reports / Fund Transaction Report', render: render });
})();
</script>
</body>
</html>
