<!doctype html>
<html lang="en" data-root="../../">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Promotion Detail</title>
<link rel="stylesheet" href="../../assets/app.css">
</head>
<body>
<div id="page"><div class="card" id="detail"></div></div>
<script src="../../assets/store.js"></script>
<script src="../../assets/ui.js"></script>
<script src="../../assets/sim.js"></script>
<script src="../../assets/bo.js"></script>
<script>
(function () {
  var S = Store, esc = S.esc, money = S.money;
  function render(s) {
    var p = S.promo(s, S.qs('id'));
    var el = document.getElementById('detail');
    if (!p) { el.innerHTML = 'Promotion not found.'; return; }
    var row = function (k, v, isNew) { return '<dt>' + k + (isNew ? ' <span class="tag-new">NEW</span>' : '') + '</dt><dd>' + v + '</dd>'; };
    el.innerHTML = '<div class="card-head"><div><h1>promotions / settings / view</h1><div class="muted small">#' + p.id + '</div></div>' +
      '<div>' + (S.can(s, 'update:promotions-settings') ? '<a class="btn sec" href="update.html?id=' + p.id + '">Edit</a> ' : '') + '<a class="btn sec" href="list.html">Back</a></div></div><dl class="kv">' +
      row('Promotion Name', esc(p.name)) + row('Start Date', p.from) + row('End Date', p.to + '(結束時間 ' + S.fmt(S.promoEnd(p)) + ')') +
      row('Player Ranking', esc(p.ranks.join(', '))) + row('Deposit Option', esc(p.depOption)) + row('Minimum Amount', p.min == null ? '—(無存款條件)' : money(p.min)) + row('Maximum Amount', p.max == null ? '—' : money(p.max)) +
      row('Payout Frequency', S.FREQ[p.freq]) + row('Vendors', esc(p.vendors.join(', '))) + row('Terms and Conditions', esc(p.tnc.replace(/<[^>]+>/g, ''))) +
      row('Payment Method', S.PAYOUT[p.payout].name, true) + row('Percentage', p.pct + '%') + row('Max Campaign Amount', money(p.maxCampaign)) +
      row('Turnover Amount', money(p.turnover)) + row('Tier Points', p.tierPoints || '—') +
      row('Claim Credits To(Claim 後入帳)', p.payout === 'promo_wallet' ? S.PAYOUT[S.PW_CREDIT].name + '(Via Promo Wallet)' : '—(Direct Payout)', true) +
      row('Claim Period After Promotion Ends', p.payout === 'promo_wallet' ? p.claimDays + ' day(s) → 領取截止 ' + S.fmt(S.promoEnd(p) + p.claimDays * S.DAY) : '—(Direct Payout)', true) +
      row('Status', p.active ? 'Active' : 'Inactive') +
      row('Created By', esc(p.createdBy)) + row('Created At', S.fmt(p.createdAt)) + row('Updated By', esc(p.updatedBy)) + row('Updated At', S.fmt(p.updatedAt)) + row('Banner', '—') +
      '</dl>';
  }
  BO.init({ perm: 'view:promotions-settings', active: 'promotions-settings', crumb: 'Promotions / Promotion Settings / View', render: render });
})();
</script>
</body>
</html>
