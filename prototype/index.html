<!doctype html>
<html lang="en" data-root="">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>OKADA Backoffice Prototype</title>
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<div id="page">
  <div class="card">
    <h1>OKADA 後台原型</h1>
    <p class="muted">REQ-0008 新增優惠錢包功能(Promo Wallet)+ REQ-0011 領取紀錄可追溯 · 純靜態原型,所有資料皆為假資料,存在瀏覽器 localStorage;所有頁面共用同一份狀態。每個頁面右下角都有「模擬控制台」。</p>
    <div style="display:grid;grid-template-columns:minmax(0,1.2fr) minmax(320px,1fr);gap:20px" id="home-grid">
      <div>
        <h2>頁面清單</h2>
        <div id="pages"></div>
        <h2 style="margin-top:20px">預設假資料(測試情境)</h2>
        <div id="scenarios"></div>
        <h2 style="margin-top:20px">REQ-0011~0013 測試指引</h2>
        <div id="guide"></div>
      </div>
      <div id="sim-inline" style="background:#fffdf9;border:1px solid #f1d9bd;border-radius:8px;padding:12px 14px"></div>
    </div>
  </div>
</div>
<script src="assets/store.js"></script>
<script src="assets/ui.js"></script>
<script src="assets/sim.js"></script>
<script src="assets/bo.js"></script>
<script>
(function () {

  BO.init({ crumb: 'Prototype Home' });
})();

</html>
